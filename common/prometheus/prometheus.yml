global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "user-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["user-service:8081"]

  - job_name: "product-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["product-service:8082"]

  - job_name: "discovery-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["discovery-service:8761"]

  - job_name: "inventory-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["inventory-service:8083"]

  - job_name: "order-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order-service:8084"]

  - job_name: "payment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["payment-service:8085"]

  - job_name: "search-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["search-service:8093"]

  - job_name: "gateway-synthetic"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-gateway:8080/actuator/health
        labels:
          probe: gateway-health
      - targets:
          - http://api-gateway:8080/api/v1/products?page=0&size=1
        labels:
          probe: product-list
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [probe]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

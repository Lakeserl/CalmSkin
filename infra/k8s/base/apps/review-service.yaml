apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: calmskin
  labels:
    app: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: review-service
          image: ghcr.io/lakeserl/calmskin-review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: calmskin-common-config
            - secretRef:
                name: calmskin-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DB_REVIEW_SERVICE)"
            - name: S3_BUCKET
              value: "calmskin-app-review-media-dev"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: S3_ACCESS_KEY
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: S3_SECRET_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: calmskin
spec:
  type: ClusterIP
  selector:
    app: review-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-skin-analysis-service
  namespace: calmskin
  labels:
    app: ai-skin-analysis-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-skin-analysis-service
  template:
    metadata:
      labels:
        app: ai-skin-analysis-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8095"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: ai-skin-analysis-service
          image: ghcr.io/lakeserl/calmskin-ai-skin-analysis-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          envFrom:
            - configMapRef:
                name: calmskin-common-config
            - secretRef:
                name: calmskin-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DB_AI_SKIN_ANALYSIS)"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8082"
            - name: USER_SERVICE_URL
              value: "http://user-service:8081"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: GEMINI_API_KEY
                  optional: true
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: CLOUDINARY_URL
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8095
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8095
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-skin-analysis-service
  namespace: calmskin
spec:
  type: ClusterIP
  selector:
    app: ai-skin-analysis-service
  ports:
    - name: http
      port: 8095
      targetPort: 8095

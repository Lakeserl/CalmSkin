apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: calmskin
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8088"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/lakeserl/calmskin-notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: calmskin-common-config
            - secretRef:
                name: calmskin-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/$(POSTGRES_DB_NOTIFICATION_SERVICE)"
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: MAIL_USERNAME
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: MAIL_PASSWORD
                  optional: true
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: VAPID_PUBLIC_KEY
                  optional: true
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: calmskin-integrations
                  key: VAPID_PRIVATE_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 40
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: calmskin
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8088
      targetPort: 8088
